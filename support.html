<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Caveman Dan</title>
<style>
  :root {
    --max-width: 620px;
    --text: #1f2328;
    --muted: #57606a;
    --bg: #ffffff;
    --accent: #8a4b08;
    --border: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }
  main {
    max-width: var(--max-width);
    margin: 60px auto;
    width: 100%;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 4px;
  }
  .tagline {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 28px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 8px;
    color: var(--accent);
  }
  .card p { margin: 0; }
  a.email {
    display: inline-block;
    margin-top: 4px;
    font-weight: 600;
    color: #0a58ca;
    text-decoration: none;
    word-break: break-word;
  }
  a.email:hover { text-decoration: underline; }
  nav {
    margin-top: 24px;
    font-size: 0.95rem;
  }
  nav a {
    color: #0a58ca;
    text-decoration: none;
    margin-right: 18px;
  }
  nav a:hover { text-decoration: underline; }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Caveman Dan</h1>
  <p class="tagline">A free hexa block puzzle game for iOS.</p>

  <div class="card">
    <h2>Questions or issues?</h2>
    <p>Email us and we'll get back to you.</p>
    <a class="email" href="mailto:moonstoneinternetventures@gmail.com">moonstoneinternetventures@gmail.com</a>
  </div>

  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </nav>

  <footer>
    <p>&copy; 2026 Moonstone Internet Ventures LLC.</p>
  </footer>
</main>
</body>
</html>
